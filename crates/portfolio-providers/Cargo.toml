[package]
name = "portfolio-providers"
version = "0.1.0"
description = "Read-only provider adapters and synchronization for Portfolio Desk."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
portfolio-core = { path = "../portfolio-core" }
portfolio-store = { path = "../portfolio-store" }
bigdecimal.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls-native-roots"] }
url = "2"
base64 = "0.22"
png = "0.18"
sha2 = "0.10"
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true

[features]
ts = ["dep:ts-rs", "portfolio-store/ts"]
