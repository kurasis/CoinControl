name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  offline:
    name: Checks and offline tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # The Tauri crate embeds the built frontend at compile time.
      - name: Build frontend
        run: npm run build

      - name: npm run check
        run: npm run check

      - name: npm run test:offline
        run: npm run test:offline

      - name: TypeScript bindings are up to date
        run: |
          npm run gen:bindings
          git diff --exit-code -- src/ipc/bindings
          test -z "$(git status --porcelain -- src/ipc/bindings)"

  live-api:
    name: Live provider tests (read-only)
    runs-on: ubuntu-24.04
    # Secrets are not available to pull requests from forks; skip there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      RUN_LIVE_API_TESTS: "1"
      LIVE_TEST_MAX_REQUESTS_PER_PROVIDER: "50"
      LIVECOINWATCH_API_KEY: ${{ secrets.LIVECOINWATCH_API_KEY }}
      ZERION_API_KEY: ${{ secrets.ZERION_API_KEY }}
      TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
      TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Stage D providers join the run only when their secrets are configured,
      # so a repository without them still gets the stage B/C live checks.
      - name: Select live providers
        run: |
          providers=esplora,zerion,livecoinwatch,defillama
          if [ -n "$TRONGRID_API_KEY" ]; then providers="$providers,trongrid"; else echo "trongrid: TRONGRID_API_KEY secret not set, not selected"; fi
          if [ -n "$TONAPI_API_KEY" ]; then providers="$providers,tonapi"; else echo "tonapi: TONAPI_API_KEY secret not set, not selected"; fi
          echo "LIVE_TEST_PROVIDERS=$providers" >> "$GITHUB_ENV"

      - name: npm run test:live
        run: npm run test:live

      - name: Sanitized live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-report
          path: target/live-report/
          if-no-files-found: warn

  windows-installer:
    name: Windows NSIS installer (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Rust tests on Windows
        run: cargo test --workspace --all-targets

      - name: npm run build:windows
        run: npm run build:windows

      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-desk-windows-nsis-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
