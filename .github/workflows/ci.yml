name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  offline:
    name: Checks and offline tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # The Tauri crate embeds the built frontend at compile time.
      - name: Build frontend
        run: npm run build

      - name: npm run check
        run: npm run check

      - name: npm run test:offline
        run: npm run test:offline

      - name: TypeScript bindings are up to date
        run: |
          npm run gen:bindings
          git diff --exit-code -- src/ipc/bindings
          test -z "$(git status --porcelain -- src/ipc/bindings)"

  live-api:
    name: Live provider tests (read-only)
    runs-on: ubuntu-24.04
    # Secrets are not available to pull requests from forks; skip there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      RUN_LIVE_API_TESTS: "1"
      LIVE_TEST_MAX_REQUESTS_PER_PROVIDER: "50"
      LIVECOINWATCH_API_KEY: ${{ secrets.LIVECOINWATCH_API_KEY }}
      ZERION_API_KEY: ${{ secrets.ZERION_API_KEY }}
      TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
      TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Stage D providers join the run only when their secrets are configured,
      # so a repository without them still gets the stage B/C live checks.
      - name: Select live providers
        run: |
          providers=esplora,zerion,livecoinwatch,defillama
          if [ -n "$TRONGRID_API_KEY" ]; then providers="$providers,trongrid"; else echo "trongrid: TRONGRID_API_KEY secret not set, not selected"; fi
          if [ -n "$TONAPI_API_KEY" ]; then providers="$providers,tonapi"; else echo "tonapi: TONAPI_API_KEY secret not set, not selected"; fi
          echo "LIVE_TEST_PROVIDERS=$providers" >> "$GITHUB_ENV"

      - name: npm run test:live
        run: npm run test:live

      - name: Sanitized live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-report
          path: target/live-report/
          if-no-files-found: warn

  windows-installer:
    name: Windows NSIS installer (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Rust tests on Windows
        run: cargo test --workspace --all-targets

      - name: npm run build:windows
        env:
          LIVECOINWATCH_API_KEY: CC_RELEASE_SENTINEL_SECRET_74fcbf7c
          ZERION_API_KEY: CC_RELEASE_SENTINEL_SECRET_74fcbf7c
          TRONGRID_API_KEY: CC_RELEASE_SENTINEL_SECRET_74fcbf7c
          TONAPI_API_KEY: CC_RELEASE_SENTINEL_SECRET_74fcbf7c
        run: npm run build:windows

      - name: Install launch upgrade and uninstall production build
        shell: pwsh
        run: ./scripts/install-smoke-windows.ps1

      - name: Inspect production release and installer
        env:
          LIVECOINWATCH_API_KEY: CC_RELEASE_SENTINEL_SECRET_74fcbf7c
          ZERION_API_KEY: CC_RELEASE_SENTINEL_SECRET_74fcbf7c
        run: npm run verify:release

      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-desk-windows-nsis-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-evidence
          path: target/release-report/
          if-no-files-found: error

  windows-native:
    name: Windows native recovery and public BTC scenarios
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/native-e2e"
          cache-on-failure: true
      - run: npm ci
      - run: npm run build
      - name: Build isolated native automation binary
        run: cargo build -p portfolio-desk --features native-e2e --target-dir target/native-e2e
      - name: Install pinned Tauri WebDriver
        run: cargo install tauri-driver --version 2.0.5 --locked
      - name: Install matching WebView2 Edge WebDriver
        shell: pwsh
        run: |
          function Find-WebViewRuntime {
            @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe", "$env:ProgramFiles\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe") | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } | Sort-Object { [version]$_.VersionInfo.ProductVersion } -Descending | Select-Object -First 1
          }
          $runtime = Find-WebViewRuntime
          if (-not $runtime) {
            $bootstrap = Join-Path $env:RUNNER_TEMP "WebView2Setup.exe"
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrap
            $setup = Start-Process $bootstrap -ArgumentList @('/silent', '/install') -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "WebView2 setup failed: $($setup.ExitCode)" }
            $runtime = Find-WebViewRuntime
          }
          if (-not $runtime) { throw "Microsoft WebView2 runtime is unavailable" }
          $version = $runtime.VersionInfo.ProductVersion
          Write-Host "Matching Edge WebDriver to WebView2 runtime $version"
          $zip = Join-Path $env:RUNNER_TEMP "edgedriver.zip"
          $dir = Join-Path $env:RUNNER_TEMP "edgedriver"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          "EDGE_WEBDRIVER_PATH=$dir\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Native scenarios through real IPC and SQLite
        env:
          RUN_LIVE_API_TESTS: "1"
        run: npm run test:e2e:windows -- --live-btc
      - name: Native evidence and acceptance gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-evidence
          path: target/native-report/
          if-no-files-found: error

  performance:
    name: Cached load measurements (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Measure 50 accounts, 500 assets and 100000 legs (no network)
        run: npm run test:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.os }}
          path: target/performance-report/
          if-no-files-found: error
